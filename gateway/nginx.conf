# API Gateway: único ponto de entrada (porta 8000). Entrega a tela e encaminha cada rota ao serviço certo.
# O nome dos serviços é resolvido a cada requisição (resolver do Docker), então o gateway sobe mesmo
# que um serviço esteja parado e responde 502 só nas rotas daquele serviço.

resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 8000;
    server_tokens off;
    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;

    # Login e usuários -> serviço de Usuários
    location ~ ^/(auth|usuarios)(/|$) {
        set $destino http://usuarios:8000;
        proxy_pass $destino;
    }

    # Equipamentos -> serviço de Inventário
    location ~ ^/ativos(/|$) {
        set $destino http://inventario:8000;
        proxy_pass $destino;
    }

    # Chamados -> serviço de Chamados
    location ~ ^/chamados(/|$) {
        set $destino http://chamados:8000;
        proxy_pass $destino;
    }

    # BÔNUS (serviço de Notificações ainda não existe): a tela continua funcionando com lista vazia
    location = /notificacoes {
        default_type application/json;
        return 200 '[]';
    }

    location = /saude {
        default_type application/json;
        return 200 '{"status":"ok","servico":"gateway"}';
    }

    # A tela do HelpDesk (index.html, app.js, estilo.css)
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
