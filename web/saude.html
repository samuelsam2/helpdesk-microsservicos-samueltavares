<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saúde dos serviços - HelpDesk TI</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f3f4f8; color: #1b2540; margin: 0; }
  header { background: #14213d; color: #fff; padding: 16px 24px; font-weight: 600; }
  main { max-width: 560px; margin: 32px auto; padding: 0 16px; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  .servico { display: flex; align-items: center; justify-content: space-between; background: #fff;
             border: 1px solid #e2e5ee; border-radius: 10px; padding: 14px 18px; margin-bottom: 10px; }
  .nome { font-weight: 600; text-transform: capitalize; }
  .estado { font-size: 14px; padding: 4px 12px; border-radius: 999px; }
  .ok { background: #dcfce7; color: #166534; }
  .fora { background: #fee2e2; color: #991b1b; }
  .espera { background: #e5e7eb; color: #374151; }
  p { font-size: 13px; color: #5b6478; }
</style>
</head>
<body>
<header>HelpDesk TI · saúde dos serviços</header>
<main>
  <h1>Quais serviços estão no ar?</h1>
  <div id="lista"></div>
  <p>Atualiza sozinho a cada 3 segundos. Cada linha consulta <code>/saude/&lt;serviço&gt;</code> pelo gateway.</p>
</main>
<script>
const SERVICOS = ["gateway", "usuarios", "inventario", "chamados", "notificacoes"];
const lista = document.getElementById("lista");

for (const nome of SERVICOS) {
  const linha = document.createElement("div");
  linha.className = "servico";
  linha.innerHTML = '<span class="nome"></span><span class="estado espera" id="e-' + nome + '">verificando...</span>';
  linha.querySelector(".nome").textContent = nome;
  lista.appendChild(linha);
}

async function verificar(nome) {
  const el = document.getElementById("e-" + nome);
  const controle = new AbortController();
  const tempo = setTimeout(() => controle.abort(), 3000);
  try {
    const r = await fetch("/saude/" + nome, { signal: controle.signal, cache: "no-store" });
    const dados = r.ok ? await r.json() : null;
    if (dados && dados.status === "ok") {
      el.className = "estado ok"; el.textContent = "no ar";
    } else {
      el.className = "estado fora"; el.textContent = "fora do ar";
    }
  } catch (e) {
    el.className = "estado fora"; el.textContent = "fora do ar";
  } finally {
    clearTimeout(tempo);
  }
}

function atualizar() { SERVICOS.forEach(verificar); }
atualizar();
setInterval(atualizar, 3000);
</script>
</body>
</html>
