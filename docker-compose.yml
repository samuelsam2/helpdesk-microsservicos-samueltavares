# Só o gateway publica porta. Os serviços e os bancos ficam na rede interna do Docker.
x-servico: &servico
  env_file: .env
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"   # só acessível pelo próprio computador
    depends_on:
      - usuarios
      - inventario
      - chamados
      - notificacoes
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  usuarios:
    <<: *servico
    build: ./usuarios
    environment:
      DATABASE_URL: sqlite:////dados/usuarios.db
      DADOS_EXEMPLO: ${DADOS_EXEMPLO:-1}
    volumes:
      - usuarios_dados:/dados

  inventario:
    <<: *servico
    build: ./inventario
    environment:
      DATABASE_URL: sqlite:////dados/inventario.db
      DADOS_EXEMPLO: ${DADOS_EXEMPLO:-1}
    volumes:
      - inventario_dados:/dados

  chamados:
    <<: *servico
    build: ./chamados
    environment:
      DATABASE_URL: sqlite:////dados/chamados.db
      DADOS_EXEMPLO: ${DADOS_EXEMPLO:-1}
      USUARIOS_URL: http://usuarios:8000
      INVENTARIO_URL: http://inventario:8000
      TIMEOUT_SEGUNDOS: "3"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - chamados_dados:/dados
    # Chamados NÃO espera o Redis nem as Notificações: se estiverem fora do ar, o chamado abre do mesmo jeito.

  # BÔNUS: serviço de Notificações. Lê os eventos da fila e guarda os avisos no banco dele.
  notificacoes:
    <<: *servico
    build: ./notificacoes
    environment:
      DATABASE_URL: sqlite:////dados/notificacoes.db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - notificacoes_dados:/dados

  # BÔNUS: fila de eventos. Fica só na rede interna (nenhuma porta publicada).
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    user: redis
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - redis_dados:/data

volumes:
  usuarios_dados:
  inventario_dados:
  chamados_dados:
  notificacoes_dados:
  redis_dados:
